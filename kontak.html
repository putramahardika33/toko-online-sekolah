<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Sekolah - Kontak</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        nav {
            background-color: #2563eb;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav div {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .contact {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .contact h1 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 10px;
        }

        .contact > p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        footer {
            background-color: #111827;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav div {
                gap: 15px;
            }

            .contact {
                margin: 30px 15px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <h2>Toko Sekolah</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="produk.html">Produk</a>
            <a href="kontak.html">Kontak</a>
        </div>
    </nav>

    <!-- KONTAK -->
    <main class="contact">

        <h1>Kontak Kami</h1>

        <p>
            Silakan kirim pesan kepada kami melalui
            formulir berikut.
        </p>

        <form>

            <div class="form-group">
                <label for="nama">Nama</label>

                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>

                <textarea
                    id="pesan"
                    name="pesan"
                    placeholder="Tulis pesan kamu..."
                    required
                ></textarea>
            </div>

            <button type="submit">
                Kirim Pesan
            </button>

        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Toko Online Sekolah</p>
    </footer>

</body>
</html>
